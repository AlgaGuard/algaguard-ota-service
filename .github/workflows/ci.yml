name: CI
on:
  pull_request:
  push:
    branches: [develop]
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: algaguard
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: ota
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U algaguard -d ota"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AlgaGuard/algaguard-contracts
          ref: develop
          path: algaguard-contracts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start MinIO and wait for readiness
        run: |
          docker run -d --name minio-ci -p 9000:9000 \
            -e MINIO_ROOT_USER=algaguard-test \
            -e MINIO_ROOT_PASSWORD=integration-only-secret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:9000/minio/health/ready; then exit 0; fi
            sleep 1
          done
          docker logs minio-ci
          exit 1
      - run: npm run migrate
        env:
          DATABASE_URL: postgresql://algaguard:integration-only@localhost:5432/ota
      - run: npm run check
        env:
          CONTRACTS_DIR: algaguard-contracts
          TEST_DATABASE_URL: postgresql://algaguard:integration-only@localhost:5432/ota
          TEST_MINIO_ENDPOINT: http://localhost:9000
          TEST_MINIO_ACCESS_KEY: algaguard-test
          TEST_MINIO_SECRET_KEY: integration-only-secret
      - run: npm audit --audit-level=high
      - run: docker build -t algaguard-ota-service:ci .
  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/algaguard/algaguard-ota-service:${{ github.sha }}
